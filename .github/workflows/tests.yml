name: tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} (Laravel ${{ matrix.laravel }}, ${{ matrix.dependencies }} deps)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported combination (minimum dependency versions).
          - php: '8.1'
            laravel: '^10.0'
            testbench: '^8.0'
            dependencies: 'lowest'

          # Newest supported Laravel major per PHP release line.
          - php: '8.1'
            laravel: '^10.0'
            testbench: '^8.0'
            dependencies: 'highest'
          - php: '8.2'
            laravel: '^11.0'
            testbench: '^9.0'
            dependencies: 'highest'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
            dependencies: 'highest'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            dependencies: 'highest'
          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'
            dependencies: 'highest'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        # Pin the Laravel major for this job by editing composer.json (the
        # repository is lockfile-less, so `composer update pkg:constraint` is
        # not allowed — a plain `composer update` resolves the pins).
        run: |
          composer require \
            laravel/framework:${{ matrix.laravel }} \
            orchestra/testbench:${{ matrix.testbench }} \
            --dev --no-update --no-interaction --no-progress
          composer update \
            ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }} \
            --prefer-dist --no-interaction --no-progress

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Run tests
        run: vendor/bin/pest

      - name: Check code style
        run: vendor/bin/pint --test
